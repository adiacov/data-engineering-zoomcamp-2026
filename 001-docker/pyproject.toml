[project]
name = "pipeline"
version = "0.0.1"
dependencies = [
    "pandas==2.3",
    "pyarrow==22.0.0",
    "sqlalchemy==2.0.45",
    "psycopg2-binary==2.9.11",
    "click==8.3.1",
    "tqdm==4.67.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
