name: taxi_rides_ny

profile: taxi_rides_ny

# I know the documentation recommend to not include the absolute path. This is a development project. I don't want to have multiple copies of files.
seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  ny_taxi:
    +schema: raw

models:
  taxi_rides_ny:
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    marts:
      +materialized: table
