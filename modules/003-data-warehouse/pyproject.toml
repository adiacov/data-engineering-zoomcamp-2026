[project]
name = "warehouse"
version = "0.1.0"
description = "Data Engineering Zoomcamp — Module 03 Data Warehouse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # module dependencies
    "common",
    # tool dependencies
    "google-cloud-storage>=3.9.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]

[project.scripts]
m3 = "warehouse.main:main"

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
