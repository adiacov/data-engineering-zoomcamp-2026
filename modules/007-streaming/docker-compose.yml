name: redpanda-local

networks:
  streaming_network:
    driver: bridge

volumes:
  redpanda: null
  streaming_taxi_data: null
  streaming_pgadmin_data: null

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.10
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Address the broker advertises to clients that connect to the Kafka API.
      # Use the internal addresses to connect to the Redpanda brokers
      # from inside the same Docker network.
      # Use the external addresses to connect to the Redpanda brokers
      # from outside the Docker network.
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      # Address the broker advertises to clients that connect to the HTTP Proxy.
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      # Mode dev-container uses well-known configuration properties for development in containers.
      - --mode dev-container
      # Tells Seastar (the framework Redpanda uses under the hood) to use 1 core on the system.
      - --smp 1
      - --default-log-level=info
    ports:
      - "19092:19092"
    networks:
      - streaming_network
    volumes:
      - redpanda:/var/lib/redpanda/data

  console:
    image: docker.redpanda.com/redpandadata/console:v3.5.3
    container_name: redpanda-console
    depends_on:
      - redpanda
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    networks:
      - streaming_network

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ny_taxi
    ports:
      - 5432:5432
    volumes:
      - streaming_taxi_data:/var/lib/postgresql
    networks:
      - streaming_network
    depends_on:
      redpanda:
        condition: service_started

  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
  #     PGADMIN_DEFAULT_PASSWORD: "admin"
  #   volumes:
  #     - streaming_pgadmin_data:/var/lib/pgadmin
  #   ports:
  #     - 5050:80
  #   networks:
  #     - streaming_network
  #   depends_on:
  #     postgres:
  #       condition: service_started

  jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    image: pyflink-streaming
    pull_policy: never
    container_name: jobmanager
    expose:
      - "6123"
    networks:
      - streaming_network
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
    volumes:
      - ./:/opt/flink/usrlib
      - ./src:/opt/src
    depends_on:
      - postgres

  taskmanager:
    image: pyflink-streaming
    pull_policy: never
    expose:
      - "6121"
      - "6122"
    container_name: taskmanager
    depends_on:
      - jobmanager
    networks:
      - streaming_network
    command: taskmanager --taskmanager.registration.timeout 5 min
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 15
        taskmanager.memory.process.size: 1728m
        parallelism.default: 3
    volumes:
      - ./:/opt/flink/usrlib
      - ./src:/opt/src
