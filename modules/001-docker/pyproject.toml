[project]
name = "pipeline"
version = "0.1.0"
description = "Data Engineering Zoomcamp — Module 01 Docker and Terraform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # module dependencies
    "common",

    # tool dependencies
    "click>=8.3.1",
    "numpy>=1.25",
    "pandas>=2.2",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=12.0.0",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.45",
    "tqdm>=4.67.1",
]

[project.scripts]
m1 = "pipeline.main:main"
ingest = "pipeline.ingest_data:run"

[tool.uv.sources]
common = { workspace = true }

[tool.uv.extra-build-dependencies]
pandas = ["mesonpy"]
pyarrow = ["setuptools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
