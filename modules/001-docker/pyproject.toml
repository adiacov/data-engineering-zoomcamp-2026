[project]
name = "pipeline"
version = "0.1.0"
description = "Data Engineering Zoomcamp — Module 01 Docker and Terraform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "pandas>=2.3",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=22.0.0",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.45",
    "tqdm>=4.67.1",
]

[project.scripts]
m1 = "pipeline.main:main"
ingest = "pipeline.ingest_data:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


