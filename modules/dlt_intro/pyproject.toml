[project]
name = "dlt_intro"
version = "0.1.0"
description = "Data Engineering Zoomcamp — DLT Intro (dlt -> docs)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dlt[duckdb,workspace]>=1.22.1",
]

[project.scripts]
open_library_pipeline="dlt_intro.open_library_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
